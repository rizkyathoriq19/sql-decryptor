[package]
name = "sql-decryptor-desktop"
version = "0.1.0"
description = "Read-only SQL Server encrypted stored procedure inspector"
authors = ["Local project"]
edition = "2021"

[lib]
name = "sql_decryptor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync"] }
